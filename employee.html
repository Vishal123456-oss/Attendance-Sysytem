<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Employee Attendance</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f2f5f9;
    margin:0;
    padding:20px;
}

.card{
    max-width:500px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.15);
}

h1{
    text-align:center;
    margin-top:0;
}

.row{
    display:flex;
    justify-content:space-between;
    padding:12px 0;
    border-bottom:1px solid #ddd;
}

.label{
    font-weight:bold;
}

.value{
    text-align:right;
}

.attendance{
    margin-top:20px;
}

.day{
    display:flex;
    justify-content:space-between;
    padding:9px;
    border-bottom:1px solid #eee;
}

.loading{
    text-align:center;
    padding:30px;
}

.error{
    color:#c00;
    text-align:center;
    padding:20px;
}
</style>
</head>

<body>

<div class="card">

<h1>Employee Attendance</h1>

<div id="loading" class="loading">
Loading employee data...
</div>

<div id="error" class="error" style="display:none;"></div>

<div id="data" style="display:none;">

<div class="row">
<span class="label">Employee</span>
<span class="value" id="name"></span>
</div>

<div class="row">
<span class="label">Daily Wage</span>
<span class="value">₹<span id="wage"></span></span>
</div>

<div class="row">
<span class="label">Present Days</span>
<span class="value" id="present"></span>
</div>

<div class="row">
<span class="label">OT Hours</span>
<span class="value" id="ot"></span>
</div>

<div class="row">
<span class="label">OT Wages</span>
<span class="value">₹<span id="otwage"></span></span>
</div>

<div class="row">
<span class="label">Monthly Wage</span>
<span class="value">₹<span id="monthly"></span></span>
</div>

<h3 id="month"></h3>

<div class="attendance" id="attendance"></div>

</div>

</div>

<script>

const excelFile = "sep2026.xlsx";

const params = new URLSearchParams(window.location.search);
const employeeId = Number(params.get("id"));

const loading = document.getElementById("loading");
const dataBox = document.getElementById("data");
const errorBox = document.getElementById("error");

function showError(message){

    loading.style.display = "none";

    errorBox.style.display = "block";

    errorBox.innerHTML =
        "❌ " + message;
}

if(!employeeId){

    showError(
        "Employee ID missing.<br><br>" +
        "Use: employee.html?id=1"
    );

}else{

fetch(excelFile)

.then(response => {

    if(!response.ok){
        throw new Error(
            "Excel file not found. Check filename."
        );
    }

    return response.arrayBuffer();

})

.then(buffer => {

    const workbook = XLSX.read(buffer,{
        type:"array"
    });

    const sheetName = "September Attendance";

    const sheet = workbook.Sheets[sheetName];

    if(!sheet){

        throw new Error(
            "September Attendance sheet not found."
        );

    }

    const rows = XLSX.utils.sheet_to_json(
        sheet,
        {
            header:1,
            defval:""
        }
    );

    /*
       Excel structure:

       Row 5 = Employee 1
       Row 6 = Employee 2
       Row 7 = Employee 3

       A = Name
       B = Daily Wage
       C:AG = Attendance
       AH = Present Days
       AI = OT Hours
       AJ = OT Wages
       AK = Monthly Wage
    */

    const rowNumber = employeeId + 4;

    const row = rows[rowNumber - 1];

    if(!row || !row[0]){

        throw new Error(
            "Employee ID " +
            employeeId +
            " not found."
        );

    }

    const name = row[0];

    const wage = Number(row[1]) || 0;

    /*
       C:AG attendance
       Index 2 to 32
    */

    const attendance = row.slice(2,33);

    let presentDays = 0;
    let otHours = 0;

    let attendanceHTML = "";

    attendance.forEach((status,index)=>{

        status = String(status).trim();

        const day = index + 1;

        if(status === ""){
            return;
        }

        /*
           P = Present
           H = Half day
        */

        if(
            status === "P" ||
            status.toUpperCase().startsWith("P+")
        ){

            presentDays += 1;

        }

        else if(
            status === "H" ||
            status.toUpperCase().startsWith("H+")
        ){

            presentDays += 0.5;

        }

        /*
           OT:
           P+1OT
           P+2OT
           H+1OT
           etc.
        */

        const otMatch =
            status.match(/\+(\d+(?:\.\d+)?)\s*OT/i);

        if(otMatch){

            otHours += Number(otMatch[1]);

        }

        attendanceHTML += `

        <div class="day">

            <span>
                Day ${day}
            </span>

            <strong>
                ${status}
            </strong>

        </div>

        `;

    });


    /*
       OT rate:
       Daily wage ÷ 8
    */

    const otRate = wage / 8;

    const otWage =
        otHours * otRate;


    /*
       Normal monthly wage
    */

    const normalWage =
        presentDays * wage;


    /*
       Total monthly wage
    */

    const monthlyWage =
        normalWage + otWage;


    document.getElementById("name")
        .textContent = name;

    document.getElementById("wage")
        .textContent = wage.toFixed(2);

    document.getElementById("present")
        .textContent = presentDays;

    document.getElementById("ot")
        .textContent = otHours.toFixed(2);

    document.getElementById("otwage")
        .textContent = otWage.toFixed(2);

    document.getElementById("monthly")
        .textContent = monthlyWage.toFixed(2);

    document.getElementById("month")
        .textContent = "September 2026";

    document.getElementById("attendance")
        .innerHTML = attendanceHTML;


    loading.style.display = "none";

    dataBox.style.display = "block";

})

.catch(error => {

    console.error(error);

    showError(error.message);

});

}

</script>

</body>
</html>
