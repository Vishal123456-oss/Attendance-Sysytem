<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Test</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>

<body>

<h2 id="status">Step 1: Starting...</h2>

<script>

const status = document.getElementById("status");

status.innerHTML = "Step 1: JavaScript working ✅";

const params = new URLSearchParams(window.location.search);
const employeeId = params.get("id");

status.innerHTML +=
    "<br>Step 2: Employee ID = " + employeeId;

const excelFile = "sep2026.xlsx";

fetch(excelFile)

.then(response => {

    status.innerHTML +=
        "<br>Step 3: Excel request completed ✅";

    if(!response.ok){
        throw new Error(
            "Excel HTTP error: " + response.status
        );
    }

    return response.arrayBuffer();

})

.then(buffer => {

    status.innerHTML +=
        "<br>Step 4: Excel file loaded ✅";

    const workbook = XLSX.read(buffer,{
        type:"array"
    });

    status.innerHTML +=
        "<br>Step 5: Excel opened ✅";

    status.innerHTML +=
        "<br>Sheets: " +
        workbook.SheetNames.join(", ");

})

.catch(error => {

    status.innerHTML +=
        "<br><br>❌ ERROR: " +
        error.message;

});

</script>

</body>
</html>
